[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-provenance-uploader"
# The version is read from swarm_provenance_uploader/__init__.py (one source)
dynamic = ["version"]
description = "A CLI toolkit for wrapping data and uploading to Swarm."
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
     "Operating System :: OS Independent",
]
dependencies = [
    # 0.12+ bundles rich and shellingham (the old [all] extra, now gone);
    # 0.23+ needs click 8.2+ and breaks CliRunner-based tests (#132)
    "typer>=0.12,<0.23",
    "click>=8.1.0,<8.2.0", # Pin click to a compatible range
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/datafund/swarm_provenance_CLI"
Repository = "https://github.com/datafund/swarm_provenance_CLI"
Issues = "https://github.com/datafund/swarm_provenance_CLI/issues"
Documentation = "https://github.com/datafund/swarm_provenance_CLI#readme"

[project.scripts]
# This creates the command-line tool name
swarm-prov-upload = "swarm_provenance_uploader.cli:app"

[project.optional-dependencies]
testing = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "requests-mock>=1.11"
]
# x402 payment support (USDC on Base chain). The signer is implemented here
# with eth-account and web3; the `x402` SDK package is not used, so it is not
# installed (it also needs Python 3.10+, which made this extra uninstallable
# on 3.9).
x402 = [
    "eth-account>=0.13.5",
    "web3>=7.0.0",
]
# Blockchain anchoring (DataProvenance contract on Base)
# Floors are what the code uses (eth-account 0.13.5: sign_typed_data; web3 7
# accepts it). Keep in sync with swarm_provenance_uploader/_requirements.py.
blockchain = [
    "web3>=7.0.0",
    "eth-account>=0.13.5",
]

[tool.setuptools.dynamic]
version = {attr = "swarm_provenance_uploader.__version_base__"}

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (hit real backends)",
    "local_bee: marks tests that require local Bee node",
    "gateway: marks tests that require gateway service",
    "x402: marks tests that require x402 wallet configuration",
    "slow: marks tests that are slow or use real funds",
    "blockchain: marks tests that require blockchain deps",
]

[tool.setuptools.package-data]
"swarm_provenance_uploader.chain" = ["abi/*.json"]
