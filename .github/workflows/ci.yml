name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # The payment and chain code is tested with its real dependencies
        # (web3, eth-account): without them those tests skip.
        extras: ["testing", "x402,blockchain,testing"]
    name: Python ${{ matrix.python-version }} (${{ matrix.extras }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[${{ matrix.extras }}]"

      # Unit tests only: anything marked `integration` talks to real services
      # (and the example demos upload to the production gateway).
      - name: Run unit tests
        run: pytest tests/ --ignore=tests/test_integration.py -m "not integration" -v

  # One stable check name to require on protected branches, whatever the matrix.
  ci-passed:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    name: CI passed
    steps:
      - name: All test jobs succeeded
        run: test "${{ needs.test.result }}" = "success"

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    name: Integration tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[x402,blockchain,testing]" pytest-timeout

      - name: Run integration tests
        env:
          PROVENANCE_WALLET_KEY: ${{ secrets.TEST_WALLET_KEY }}
          PROVENANCE_GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          RUN_LIVE_TESTS: "1"
        run: pytest tests/test_integration.py tests/test_examples.py -m integration -v --timeout=300
